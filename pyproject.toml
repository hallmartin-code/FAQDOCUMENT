[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deckpager"
version = "0.1.0"
description = "Turn an investor pitch deck into a one-page, print-ready TEN Capital investor one-pager."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "TEN Capital" }]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "pdfplumber>=0.11",
    "python-pptx>=0.6.23",
    "anthropic>=0.40",
    "jinja2>=3.1",
    "weasyprint>=62",
    "pypdf>=4.2",
]

[project.optional-dependencies]
# Fallback PDF engine for machines without pango/cairo/gdk-pixbuf (e.g. bare Windows).
reportlab = ["reportlab>=4.2"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
]

[project.scripts]
deckpager = "deckpager.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
deckpager = ["render/templates/*.j2", "render/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/deckpager"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["fitz.*", "pdfplumber.*", "pptx.*", "weasyprint.*", "reportlab.*"]
ignore_missing_imports = true
