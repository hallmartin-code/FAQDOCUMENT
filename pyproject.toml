[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deckpager"
version = "0.1.0"
description = "Pitch deck to a one-page TEN Capital investor one-pager"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "TEN Capital Network" }]

dependencies = [
    "anthropic>=0.40",       # Claude API client (tool-use + native PDF document blocks)
    "pydantic>=2",           # single source of truth for the OnePager schema
    "pydantic-settings>=2",  # env/.env config binding
    "typer>=0.12",           # CLI
    "rich>=13",              # progress output
    "pymupdf>=1.24",         # PDF page rasterization
    "pdfplumber>=0.11",      # PDF text and table extraction
    "python-pptx>=1.0",      # PPTX text/notes extraction
    "reportlab>=4.1",        # PDF rendering (default engine)
    "python-dotenv>=1.0",    # .env loading for the CLI
]

[project.optional-dependencies]
# The WeasyPrint engine. Kept optional because it needs the GTK stack (pango, cairo,
# gdk-pixbuf) present as native libraries; `deckpager check` reports when it is not.
weasyprint = [
    "weasyprint>=62",
    "jinja2>=3.1",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pypdf>=4.2",  # page counting / text extraction of rendered PDFs
]

[project.scripts]
deckpager = "deckpager.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/deckpager"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["deckpager"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# PyMuPDF and python-pptx ship unannotated callables. This exempts calls *into* those
# packages from --strict's untyped-call rule; our own code stays fully checked.
untyped_calls_exclude = ["pymupdf", "pptx"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["deckpager"]
