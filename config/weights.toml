# Scorecard weighting — analyst-editable.
#
# Overall Investability is COMPUTED from these weights. It is not taken on faith from the
# model: the model states its own overall, pitchlens computes this weighted one, and if
# the two differ by more than 1.0 the run records a `score_divergence` warning. That
# disagreement is a signal worth reading, which is why both numbers survive into the JSON.
#
# The ten weights below must cover exactly the ten input categories and sum to 1.0.
# "Overall Investability" is the output, so it has no weight of its own.
#
# Categories the deck gives no basis for score null rather than zero. A null is excluded
# from the weighted mean and the remaining weights are renormalized, so an unscored
# category drags the overall toward neither end — it just widens the error bars. Every
# null also lands in `data_gaps`, and more than three of them caps confidence at MEDIUM.
#
# Rough correspondence to the TEN Capital conviction ladder is noted per category for
# hand-tuning. The two frameworks are NOT interchangeable — the ladder scores ten stages
# 1-5 for 50 points, this scores ten categories 1-10 — so treat the mapping as a sanity
# check on relative emphasis, not as a conversion.

[weights]
# Ladder stage 4, Founder Credibility. The single largest weight: at seed and Series A the
# founder is the asset, and the deck's evidence about them is the most decision-relevant
# thing in it.
"Founder" = 0.16

# Ladder stage 4. Bench depth and the named gaps in it.
"Executive Team" = 0.13

# Ladder stage 3, Solution Credibility. Mechanism, validation data, technical substance.
"Scientific Credibility" = 0.11

# Ladder stages 2 and 5. Whether there is a buyer, a price, and a route to them.
"Commercial Readiness" = 0.11

# Ladder stage 4. Distinct from Executive Team: this is whether the people named can run
# the company at the size the plan implies, not whether the seats are filled.
"Leadership" = 0.10

# Ladder stage 5, Market Upside. Ambition sized against evidence.
"Vision" = 0.08

# Ladder stage 1, Pattern Interrupt. Weighted lightest of the narrative categories on
# purpose — a well-told story is a real signal about the founder's ability to raise and
# sell, but it is the category most easily faked by a good designer.
"Storytelling" = 0.06

# Ladder stage 7, Traction Validation. What they have actually shipped and proven.
"Execution Capability" = 0.13

# Ladder stages 9 and 10. What they got done per dollar raised so far.
"Capital Efficiency" = 0.06

# Ladder stages 8 and 9, Risk Framing and Deal Logic. Terms, use of proceeds, runway
# reconciled against milestones.
"Fundraising Readiness" = 0.06
